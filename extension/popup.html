<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruePrice</title>
  <link rel="stylesheet" href="style.css" />
  <script src="chart.js"></script>
</head>
<body>

<!-- SVG icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
      <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/>
    </symbol>
    <symbol id="i-user-check" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/>
    </symbol>
    <symbol id="i-alert-circle" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </symbol>
  </defs>
</svg>

<div class="popup-app app">

  <!-- Header -->
  <div class="popup-header header">
    <div class="popup-brand brand">
      <div class="brand-monogram logo">T</div>
      <div class="brand-text-wrap brandText">
        <span class="popup-brand-title brandTitle">TruePrice</span>
        <span class="popup-brand-badge brandSub">Consensus</span>
      </div>
    </div>
    <button id="dashboardBtn" class="btn btn--secondary btn--icon btn--sm iconBtn" title="Open dashboard" aria-label="Open dashboard">
      <svg class="icon icon--sm"><use href="#i-dashboard"/></svg>
    </button>
  </div>

  <!-- Register view -->
  <div id="registerView" class="registerView" style="display:none;">
    <div class="registerLogo">T</div>
    <div class="registerTitle">Welcome to TruePrice</div>
    <div class="registerDesc">Register an anonymous client to start submitting price observations and viewing reputation-weighted price history.</div>
    <button id="registerBtn" class="btn btn--primary btnPrimary">
      <svg class="icon icon--sm"><use href="#i-user-check"/></svg>
      <span>Register Client</span>
    </button>
    <div id="registerError" class="errorBox" style="display:none;"></div>
  </div>

  <!-- Loading state -->
  <div id="loading" class="state">
    <div class="spinner"></div>
    <div class="stateTitle" id="loadingText">Loading...</div>
  </div>

  <!-- Error state -->
  <div id="error" class="state" style="display:none;">
    <svg class="stateIcon icon"><use href="#i-alert-circle"/></svg>
    <div class="stateTitle" id="errorTitle">Something went wrong</div>
    <div class="stateMsg" id="errorMsg"></div>
  </div>

  <!-- Main content -->
  <div id="content" class="popup-body body" style="display:none;">

    <!-- Price hero card -->
    <div class="card priceHero fadeIn">
      <div class="priceTop">
        <div>
          <span class="label priceLabel" id="productLabel">Canonical Price</span>
          <div id="currentPrice" class="priceValue">$—</div>
        </div>
        <div id="priceChange" class="priceBadge badge badge-neutral">—</div>
      </div>

      <div class="statsRow">
        <div class="stat">
          <span class="statLabel">Low</span>
          <span id="minStat" class="statValue">—</span>
        </div>
        <div class="stat">
          <span class="statLabel">High</span>
          <span id="maxStat" class="statValue">—</span>
        </div>
        <div class="stat">
          <span class="statLabel">Hours</span>
          <span id="hoursStat" class="statValue">—</span>
        </div>
      </div>

      <div class="confidenceBar">
        <div class="confidenceHeader">
          <span class="confidenceLabel">Confidence</span>
          <span class="confidenceValue" id="confidenceValue">—</span>
        </div>
        <div class="confidenceTrack">
          <div class="confidenceFill" id="confidenceFill" style="width:0%;"></div>
        </div>
      </div>
    </div>

    <!-- Chart card -->
    <div class="card chartCard fadeIn">
      <div class="chartHeader">
        <span class="chartTitle">Price History</span>
        <span class="chartMeta" id="chartMeta">—</span>
      </div>
      <div class="chart">
        <canvas id="priceChart"></canvas>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="popup-footer footer" id="footer" style="display:none;">
    <div class="footerText" id="footerStatus">
      <span class="footerDot dot-amber"></span>Connecting...
    </div>
    <div class="footerText" id="footerClient">—</div>
  </div>

</div>

<script src="popup.js"></script>

</body>
</html>
