<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruePrice</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="chart.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f10;
      --bg-elev: #18181b;
      --card: #1c1c20;
      --card-hover: #222227;
      --fg: #f4f4f5;
      --fg-muted: #a1a1aa;
      --fg-dim: #71717a;
      --border: #2a2a30;
      --border-light: #33333a;
      --accent: #f59e0b;
      --accent-dim: #b45309;
      --accent-glow: rgba(245, 158, 11, 0.15);
      --green: #10b981;
      --green-dim: #065f46;
      --green-glow: rgba(16, 185, 129, 0.12);
      --red: #ef4444;
      --red-dim: #991b1b;
      --red-glow: rgba(239, 68, 68, 0.12);
      --blue: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.2);
      --font-ui: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      width: 400px;
      background: var(--bg);
      font-family: var(--font-ui);
      color: var(--fg);
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: flex; flex-direction: column; min-height: 520px; }

    /* ─── Header ─── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px 12px;
      background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #1c1c20;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .brandText { display: flex; flex-direction: column; gap: 1px; }
    .brandTitle { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .brandSub { font-size: 10px; color: var(--fg-dim); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

    .iconBtn {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 140ms ease;
      color: var(--fg-muted);
    }
    .iconBtn:hover { background: var(--card-hover); border-color: var(--border-light); color: var(--fg); }

    /* ─── Body ─── */
    .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

    /* ─── States ─── */
    .state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 24px; text-align: center; gap: 12px; flex: 1;
    }
    .stateIcon { width: 48px; height: 48px; opacity: 0.4; }
    .stateTitle { font-size: 14px; font-weight: 600; color: var(--fg); }
    .stateMsg { font-size: 12px; color: var(--fg-dim); line-height: 1.5; max-width: 280px; }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Cards ─── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }

    /* ─── Price hero ─── */
    .priceHero { display: flex; flex-direction: column; gap: 12px; }
    .priceTop { display: flex; justify-content: space-between; align-items: flex-start; }
    .priceLabel { font-size: 10px; color: var(--fg-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
    .priceValue { font-size: 32px; font-weight: 800; letter-spacing: -1px; font-family: var(--font-mono); line-height: 1; }
    .priceBadge {
      font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 20px;
      display: flex; align-items: center; gap: 4px;
    }
    .badge-green { background: var(--green-glow); color: var(--green); border: 1px solid var(--green-dim); }
    .badge-red { background: var(--red-glow); color: var(--red); border: 1px solid var(--red-dim); }
    .badge-neutral { background: var(--card-hover); color: var(--fg-muted); border: 1px solid var(--border-light); }
    .badge-accent { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent-dim); }

    .statsRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat {
      background: var(--bg-elev); border-radius: var(--radius-sm);
      padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;
    }
    .statLabel { font-size: 9px; color: var(--fg-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .statValue { font-size: 14px; font-weight: 700; font-family: var(--font-mono); color: var(--fg); }

    /* ─── Confidence bar ─── */
    .confidenceBar { display: flex; flex-direction: column; gap: 6px; }
    .confidenceHeader { display: flex; justify-content: space-between; align-items: center; }
    .confidenceLabel { font-size: 10px; color: var(--fg-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .confidenceValue { font-size: 11px; font-weight: 700; font-family: var(--font-mono); color: var(--fg); }
    .confidenceTrack { height: 4px; background: var(--bg-elev); border-radius: 2px; overflow: hidden; }
    .confidenceFill { height: 100%; border-radius: 2px; transition: width 400ms ease; }

    /* ─── Chart ─── */
    .chartCard { display: flex; flex-direction: column; gap: 10px; }
    .chartHeader { display: flex; justify-content: space-between; align-items: center; }
    .chartTitle { font-size: 11px; color: var(--fg-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .chartMeta { font-size: 10px; color: var(--fg-dim); font-family: var(--font-mono); }
    .chart { height: 200px; position: relative; }
    canvas { width: 100% !important; height: 100% !important; }

    /* ─── Footer ─── */
    .footer {
      padding: 10px 16px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-elev);
    }
    .footerText { font-size: 10px; color: var(--fg-dim); font-family: var(--font-mono); }
    .footerDot {
      width: 6px; height: 6px; border-radius: 50%; display: inline-block;
      margin-right: 5px; vertical-align: middle;
    }
    .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot-red { background: var(--red); }
    .dot-amber { background: var(--accent); }

    /* ─── Register view ─── */
    .registerView {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 24px; text-align: center; gap: 16px; flex: 1;
    }
    .registerLogo {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 28px; color: #1c1c20;
      box-shadow: 0 0 32px var(--accent-glow);
    }
    .registerTitle { font-size: 18px; font-weight: 700; }
    .registerDesc { font-size: 12px; color: var(--fg-muted); line-height: 1.6; max-width: 280px; }

    .btn {
      appearance: none; border: none; border-radius: var(--radius-sm);
      padding: 10px 20px; font-size: 13px; font-weight: 600; font-family: var(--font-ui);
      cursor: pointer; transition: all 140ms ease; display: inline-flex;
      align-items: center; gap: 6px;
    }
    .btnPrimary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: #1c1c20; box-shadow: 0 0 16px var(--accent-glow);
    }
    .btnPrimary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
    .btnPrimary:active { transform: translateY(0); }
    .btnPrimary:disabled { opacity: 0.6; cursor: wait; transform: none; }

    .errorBox {
      background: var(--red-glow); border: 1px solid var(--red-dim);
      border-radius: var(--radius-sm); padding: 10px 14px;
      font-size: 12px; color: var(--red); max-width: 300px;
    }

    /* ─── Animations ─── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fadeIn { animation: fadeIn 200ms ease; }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="logo">T</div>
      <div class="brandText">
        <div class="brandTitle">TruePrice</div>
        <div class="brandSub">Reputation-weighted</div>
      </div>
    </div>
    <button id="dashboardBtn" class="iconBtn" title="Open dashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/>
        <rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
      </svg>
    </button>
  </div>

  <!-- Register view -->
  <div id="registerView" class="registerView" style="display:none;">
    <div class="registerLogo">T</div>
    <div class="registerTitle">Welcome to TruePrice</div>
    <div class="registerDesc">Register an anonymous client to start submitting price observations and viewing reputation-weighted price history.</div>
    <button id="registerBtn" class="btn btnPrimary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      Register
    </button>
    <div id="registerError" class="errorBox" style="display:none;"></div>
  </div>

  <!-- Loading state -->
  <div id="loading" class="state">
    <div class="spinner"></div>
    <div class="stateTitle" id="loadingText">Loading...</div>
  </div>

  <!-- Error state -->
  <div id="error" class="state" style="display:none;">
    <svg class="stateIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div class="stateTitle" id="errorTitle">Something went wrong</div>
    <div class="stateMsg" id="errorMsg"></div>
  </div>

  <!-- Main content -->
  <div id="content" class="body" style="display:none;">

    <!-- Price hero card -->
    <div class="card priceHero fadeIn">
      <div class="priceTop">
        <div>
          <div class="priceLabel" id="productLabel">Canonical Price</div>
          <div id="currentPrice" class="priceValue">$—</div>
        </div>
        <div id="priceChange" class="priceBadge badge-neutral">—</div>
      </div>

      <div class="statsRow">
        <div class="stat">
          <div class="statLabel">Low</div>
          <div id="minStat" class="statValue">—</div>
        </div>
        <div class="stat">
          <div class="statLabel">High</div>
          <div id="maxStat" class="statValue">—</div>
        </div>
        <div class="stat">
          <div class="statLabel">Hours</div>
          <div id="hoursStat" class="statValue">—</div>
        </div>
      </div>

      <div class="confidenceBar">
        <div class="confidenceHeader">
          <span class="confidenceLabel">Confidence</span>
          <span class="confidenceValue" id="confidenceValue">—</span>
        </div>
        <div class="confidenceTrack">
          <div class="confidenceFill" id="confidenceFill" style="width:0%; background: var(--accent);"></div>
        </div>
      </div>
    </div>

    <!-- Chart card -->
    <div class="card chartCard fadeIn">
      <div class="chartHeader">
        <div class="chartTitle">Price History</div>
        <div class="chartMeta" id="chartMeta">—</div>
      </div>
      <div class="chart">
        <canvas id="priceChart"></canvas>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer" id="footer" style="display:none;">
    <div class="footerText" id="footerStatus">
      <span class="footerDot dot-amber"></span>Connecting...
    </div>
    <div class="footerText" id="footerClient">—</div>
  </div>

</div>

<script src="popup.js"></script>

</body>
</html>
